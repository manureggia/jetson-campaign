# cyclictest-job con contatori di cache: come campaign-job-pilot.yaml (CPU3 in cpuset con IRQ esclusi),
# profili a 1 ms e pass core + cache_l1 + cache_l2_l3 come nelle campagne della tesi.
# 1 ripetizione da 60 s per pass.
name: job_cache_cpu3
victim_cores: [3]
isolcpu: [3]
perf_cpus: [4, 5]
repetitions: 1
randomization:
  enabled: true
  seed: 424242
duration_s: 60
cooldown_s: 0
results_dir: results/thesis
perf_min_running_pct: 90

# Stessi hook della configurazione cpuset + IRQ, più il controllo del binario modificato.
command-pre-test:
  - echo "9928a217f39cd04ad628dd0cf75e5edfdaf576a1940a02fea779aee59637c739  /home/nvidia/codex-work/cyclictest-job-20261014/cyclictest-job" | sha256sum -c
  - sudo -n jetson_clocks --fan
  - |
    set -e
    test "$(cat /proc/irq/default_smp_affinity)" = 3f || { echo "IRQ affinity is not the default" >&2; exit 1; }
    mkdir irq_isolation
    cp /home/nvidia/codex-work/cpu3-irq-isolation-2026-10-09/cpu3_irq.py irq_isolation/
    echo "76f8d84b330096a96e5d6d21b9003220c9903a1d9577fb64eeea1b439f66b665  irq_isolation/cpu3_irq.py" | sha256sum -c
    sudo -n python3 irq_isolation/cpu3_irq.py apply
    test "$(cat /proc/irq/default_smp_affinity)" = 37
    echo "default $(cat /proc/irq/default_smp_affinity)"
    for d in /proc/irq/[0-9]*; do echo "irq ${d##*/} requested=$(cat $d/smp_affinity_list) effective=$(cat $d/effective_affinity_list 2>/dev/null)"; done
    for p in /proc/[0-9]*; do c=$(cat $p/comm 2>/dev/null) || continue; case $c in irq/*) echo "thread ${p#/proc/} $c $(taskset -pc ${p#/proc/} 2>/dev/null | sed 's/.*: //')";; esac; done
command-post-test:
  - |
    sudo -n python3 irq_isolation/cpu3_irq.py restore
    test "$(cat /proc/irq/default_smp_affinity)" = 3f
    echo "default $(cat /proc/irq/default_smp_affinity)"
    for d in /proc/irq/[0-9]*; do echo "irq ${d##*/} requested=$(cat $d/smp_affinity_list) effective=$(cat $d/effective_affinity_list 2>/dev/null)"; done
    for p in /proc/[0-9]*; do c=$(cat $p/comm 2>/dev/null) || continue; case $c in irq/*) echo "thread ${p#/proc/} $c $(taskset -pc ${p#/proc/} 2>/dev/null | sed 's/.*: //')";; esac; done

perf_passes:
  core: [cycles, instructions:u, instructions:k, backend_stall, memory_stall, memory_accesses, bus_accesses, task_clock]
  cache_l1: [cycles, l1d_accesses, l1d_refills, l1d_long_miss_reads, l1i_accesses, l1i_refills, l1i_long_misses]
  cache_l2_l3: [cycles, l2_accesses, l2_refills, l2_long_miss_reads, l3_accesses, l3_refills, l3_long_miss_reads]

cyclictest:
  command: /home/nvidia/codex-work/cyclictest-job-20261014/cyclictest-job
  priority: 90
  interval_us: 1000
  histogram_us: 1000

# Byte letti/scritti per attivazione dal modello Amalthea WATERS 2019 (kB = 1000 B).
jobs:
  none:
  dasm: {read: 2000, write: 2000}
  planner_seq: {read: 1280256, write: 2000, pattern: seq}
  lidar_seq: {read: 1500000, write: 2000000, pattern: seq}

scenarios:
  baseline:
    enabled: true
    warmup_s: 10
  interfgen:
    enabled: true
    placement: same_cluster
    warmup_s: 10
    command: >
      /home/nvidia/hesoc-mark/membench/meminterf
      --size=128 --iterations=1000000 --test=memcpy
  demo:
    enabled: true
    placement: same_cluster
    profile: demos/cem_thesis.yaml

profiling:
  enabled: false
recovery:
  max_retries: 2
llm:
  enabled: false
