# Tesi, configurazione 1 (base) con cyclictest-job: CPU0 e CPU3 senza cpuset, affinità IRQ di default,
# tutte e sei le passate di campaign-thesis-base.yaml. Dopo ogni campione cyclictest esegue il lavoro
# del Planner (WATERS 2019, tools/cyclictest-job/README.md); il profilo senza lavoro gira nella stessa
# campagna per avere un riferimento con lo stesso stato della Jetson (display, IRQ).
name: thesis_base_job
victim_cores: [0, 3]
isolcpu: []
perf_cpus: [4, 5]
repetitions: 3
randomization:
  enabled: true
  seed: 424242
duration_s: 300
cooldown_s: 0
results_dir: results/thesis
perf_min_running_pct: 90

# Clock fissi come nelle altre due configurazioni; la policy IRQ deve essere quella di
# default (maschera 3f) e viene registrata prima e dopo la campagna.
command-pre-test:
  - echo "9928a217f39cd04ad628dd0cf75e5edfdaf576a1940a02fea779aee59637c739  /home/nvidia/codex-work/cyclictest-job-20261014/cyclictest-job" | sha256sum -c
  - sudo -n jetson_clocks --fan
  - |
    test "$(cat /proc/irq/default_smp_affinity)" = 3f || { echo "IRQ affinity is not the default" >&2; exit 1; }
    echo "default $(cat /proc/irq/default_smp_affinity)"
    for d in /proc/irq/[0-9]*; do echo "irq ${d##*/} requested=$(cat $d/smp_affinity_list) effective=$(cat $d/effective_affinity_list 2>/dev/null)"; done
    for p in /proc/[0-9]*; do c=$(cat $p/comm 2>/dev/null) || continue; case $c in irq/*) echo "thread ${p#/proc/} $c $(taskset -pc ${p#/proc/} 2>/dev/null | sed 's/.*: //')";; esac; done
command-post-test:
  - |
    echo "default $(cat /proc/irq/default_smp_affinity)"
    for d in /proc/irq/[0-9]*; do echo "irq ${d##*/} requested=$(cat $d/smp_affinity_list) effective=$(cat $d/effective_affinity_list 2>/dev/null)"; done
    for p in /proc/[0-9]*; do c=$(cat $p/comm 2>/dev/null) || continue; case $c in irq/*) echo "thread ${p#/proc/} $c $(taskset -pc ${p#/proc/} 2>/dev/null | sed 's/.*: //')";; esac; done

# Sei eventi programmabili per passata, più cycles sul contatore dedicato.
perf_passes:
  core: [cycles, instructions:u, instructions:k, backend_stall, memory_stall, memory_accesses, bus_accesses, task_clock]
  cache_l1: [cycles, l1d_accesses, l1d_refills, l1d_long_miss_reads, l1i_accesses, l1i_refills, l1i_long_misses]
  cache_l2_l3: [cycles, l2_accesses, l2_refills, l2_long_miss_reads, l3_accesses, l3_refills, l3_long_miss_reads]
  victim_core: [cycles, instructions:u, instructions:k, backend_stall, memory_stall, memory_accesses, bus_accesses, task_clock]
  victim_cache_l1: [cycles, l1d_accesses, l1d_refills, l1d_long_miss_reads, l1i_accesses, l1i_refills, l1i_long_misses]
  victim_cache_l2_l3: [cycles, l2_accesses, l2_refills, l2_long_miss_reads, l3_accesses, l3_refills, l3_long_miss_reads]

cyclictest:
  command: /home/nvidia/codex-work/cyclictest-job-20261014/cyclictest-job
  priority: 90
  interval_us: 1000
  # Range in µs; con -N i bucket sono da 1 ns (1000 µs = 1M bucket, 8 MB).
  histogram_us: 1000

# Byte dal modello Amalthea WATERS 2019 (kB = 1000 B), come campaign-job-pilot.yaml.
jobs:
  none:
  planner_seq: {read: 1280256, write: 2000, pattern: seq}

scenarios:
  baseline:
    enabled: true
    warmup_s: 10
  interfgen:
    enabled: true
    placement: same_cluster
    warmup_s: 10
    command: >
      /home/nvidia/hesoc-mark/membench/meminterf
      --size=128 --iterations=1000000 --test=memcpy
  demo:
    enabled: true
    placement: same_cluster
    profile: demos/cem_thesis.yaml

profiling:
  enabled: false
recovery:
  max_retries: 2
llm:
  enabled: false
