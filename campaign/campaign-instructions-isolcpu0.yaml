name: instructions-isolcpu-core0
victim_cores: [0]
isolcpu: [0]
perf_cpus: [4]
repetitions: 1
duration_s: 30
cooldown_s: 2
results_dir: results

# Stessi eventi e stessa durata del caso base; misura esterna del cgroup.
perf_passes:
  victim_instructions: [instructions:u, instructions:k]

cyclictest:
  command: cyclictest
  priority: 90
  interval_us: 1000
  histogram_us: 1000

scenarios:
  baseline:
    enabled: false
  interfgen:
    enabled: false
  demo:
    enabled: true
    placement: same_cluster
    profile: ../demos/cem_fast.yaml

profiling:
  enabled: false
recovery:
  max_retries: 2
llm:
  enabled: false
