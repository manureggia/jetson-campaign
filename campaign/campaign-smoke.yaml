# Prova breve: comandi e placement copiati dalla campagna al momento della creazione.
# DEMO legge sempre demos/cem.yaml; riallineare qui eventuali modifiche a INTERFGEN.
name: smoke_orin
victim_cores:
- 0
repetitions: 1
duration_s: 10
cooldown_s: 1
results_dir: results
cyclictest:
  command: cyclictest
  priority: 90
  interval_us: 1000
  histogram_us: 1000
scenarios:
  baseline:
    enabled: false
  interfgen:
    enabled: true
    placement: same_cluster
    warmup_s: 1
    command: '/home/nvidia/hesoc-mark/membench/meminterf --size=128 --iterations=1000000
      --test=memcpy

      '
  demo:
    enabled: true
    placement: same_cluster
    profile: ../demos/cem.yaml
profiling:
  enabled: false
  repetitions: 1
  duration_s: 300
recovery:
  max_retries: 0
llm:
  enabled: true
  backend: ollama
  model: qwen3.5:9b
  url: http://localhost:11434
  confidence_threshold: 0.85
  timeout_s: 30
  features:
  - error_classification
  required_features: []
