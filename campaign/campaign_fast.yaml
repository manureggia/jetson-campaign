name: confronto_irq_post
victim_cores: [0]
repetitions: 1
duration_s: 30
cooldown_s: 2
results_dir: results

cyclictest:
  command: cyclictest
  priority: 90
  interval_us: 1000
  histogram_us: 1000

scenarios:
  baseline:
    enabled: true
  interfgen:
    enabled: true
    placement: same_cluster
    warmup_s: 1
    command: >
      /home/nvidia/hesoc-mark/membench/meminterf
      --size=128 --iterations=1000000 --test=memcpy
  demo:
    enabled: true
    placement: same_cluster
    profile: ../demos/cem_fast.yaml

profiling:
  enabled: true
  repetitions: 1
  duration_s: 30

recovery:
  max_retries: 2

llm:
  enabled: true
  backend: ollama
  model: qwen3.5:9b
  url: http://localhost:11434
  confidence_threshold: 0.85
  timeout_s: 30
  features: [error_classification]
  required_features: []
