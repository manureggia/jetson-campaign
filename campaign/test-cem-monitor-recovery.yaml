# Regressione dei fallimenti di final_thesis_normal_affinity_4, con runner corretto.
# Solo CEM: CPU0/CPU3, tre ripetizioni, quattro passate da 10 s (24 acquisizioni).
# Stessi eventi, affinità, FIFO e profilo CEM delle condizioni che erano fallite.
# Il runner può recuperare ESRCH con tre acquisizioni; nessun retry dell'intera run.
#
# Piano: .venv/bin/python -m jetson_tests plan --config campaign/test-cem-monitor-recovery.yaml
# Avvio: .venv/bin/python -m jetson_tests run --config campaign/test-cem-monitor-recovery.yaml
# Esito atteso: 6 run PASS, 24 passate valide; tentativi scartati conservati nei log.
# Verificare monitor_failures.jsonl, acquisition_attempt e assenza di TID 0 nei log.
# Questa prova breve verifica il runner; non sostituisce le misure della tesi.
name: test_cem_monitor_recovery
victim_cores: [0, 3]
isolcpu: []
perf_cpus: [4, 5]
repetitions: 3
randomization:
  enabled: true
  seed: 424242
duration_s: 10
cooldown_s: 2
results_dir: results/regression_tests
perf_min_running_pct: 90

perf_passes:
  core: [cycles, instructions:u, instructions:k, backend_stall, memory_stall, task_clock]
  victim_memory: [cycles, memory_accesses, bus_accesses]
  l1d: [cycles, l1d_accesses, l1d_refills, l1d_long_miss_reads]
  l2: [cycles, l2_accesses, l2_refills, l2_long_miss_reads]

cyclictest:
  command: cyclictest
  priority: 90
  interval_us: 1000
  # Range in µs; con -N i bucket sono da 1 ns (1000 µs = 1M bucket, 8 MB). Massimo storico: 288 µs.
  histogram_us: 1000

scenarios:
  demo:
    enabled: true
    placement: same_cluster
    profile: ../demos/cem_final.yaml

profiling:
  enabled: false
recovery:
  max_retries: 0
llm:
  enabled: false
