[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jetson-campaign"
version = "0.1.0"
description = "Reproducible SSH campaigns for NVIDIA Jetson"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
reports = ["matplotlib>=3.9", "reportlab>=4"]

[project.scripts]
jetson-tests = "jetson_tests.cli:main"

[tool.setuptools.packages.find]
include = ["jetson_tests*"]
